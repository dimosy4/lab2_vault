<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vault · Панель администратора</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e8eef7;background:#0d1422}*{box-sizing:border-box}body{margin:0}header{padding:24px max(24px,calc((100% - 960px)/2));background:#172238;border-bottom:1px solid #293951}main{max-width:960px;margin:38px auto;padding:0 20px}h1{margin:0;font-size:27px}h2{font-size:22px}small,p{color:#a5b6ce}section{background:#172238;border:1px solid #34445e;border-radius:14px;padding:26px;margin-bottom:20px}label{display:block;margin-top:16px;margin-bottom:6px}input{width:100%;padding:13px;border:1px solid #49607e;border-radius:8px;background:#0e1728;color:white}button{background:#608af2;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;margin-top:18px;font-weight:600}button.secondary{background:#354760}button:hover{filter:brightness(1.14)}#dashboard{display:none}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;margin-top:22px}td,th{text-align:left;padding:13px;border-bottom:1px solid #34445e;font-size:14px}th{color:#a5b6ce}#message{color:#ffb3ab;min-height:24px}.pill{background:#263a56;border-radius:20px;padding:6px 12px;font-size:12px}a{color:#a8c6ff}
</style></head>
<body><header><h1>◈ Vault <span style="font-weight:400;color:#9fb6d6">/ Admin</span></h1><small>GraphQL · Управление OAuth-клиентами</small></header>
<main><p id="message" role="alert"></p>
<section id="login"><h2>Вход в систему</h2><p>Доступ к управлению клиентами есть только у администратора.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required placeholder="admin@example.com"><label>Пароль</label><input id="password" type="password" required><button type="submit">Войти</button></form></section>
<div id="dashboard"><section><div class="toolbar"><div><h2>OAuth-клиенты</h2><p>Список приложений, зарегистрированных в Vault.</p></div><div><span class="pill" id="whoami"></span> <button class="secondary" id="logout">Выйти</button></div></div><div class="toolbar"><button id="create">+ Создать клиента</button><button class="secondary" id="refresh">Обновить</button></div><table><thead><tr><th>Название</th><th>Client ID</th><th>Тип</th><th>Создан</th></tr></thead><tbody id="clientRows"></tbody></table></section></div>
<p>Сервис: <a href="/docs">REST API Docs</a> · <a href="/graphql">GraphQL Explorer</a></p></main>
<script src="/admin/app.js"></script></body></html>
